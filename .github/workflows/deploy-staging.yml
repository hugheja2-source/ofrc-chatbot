name: Deploy chatbot staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: [self-hosted, ofrc-vps]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging on VPS
        run: |
          chmod +x .github/scripts/deploy-staging-on-vps.sh
          .github/scripts/deploy-staging-on-vps.sh "$GITHUB_WORKSPACE"
      - name: Notice
        run: |
          echo "::notice title=Staging chatbot::Confirm https://chat-staging.ofrc-admin.com and https://api-chat-staging.ofrc-admin.com/api/health"
