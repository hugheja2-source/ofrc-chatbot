services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - api
    networks:
      - chatbot_production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MODE: production
        VITE_API_URL: https://api-chat.ofrc-admin.com/api
    restart: unless-stopped
    networks:
      - chatbot_production

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env.production.docker
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      PORT: "4100"
      NODE_ENV: production
      ALLOWED_ORIGINS: https://chat.ofrc-admin.com
    volumes:
      - /var/www/ofrc/chatbot/production/uploads:/var/www/ofrc/chatbot/production/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot_production

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - ./server/.env.production.docker
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot_production
    entrypoint: ["/bin/bash", "-lc"]
    command: ["chmod +x scripts/run-migrations.sh && ./scripts/run-migrations.sh"]

networks:
  chatbot_production:
    name: chatbot_production
