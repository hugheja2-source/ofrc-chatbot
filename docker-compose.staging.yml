services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - api
    networks:
      - chatbot_staging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MODE: staging
        VITE_API_URL: https://api-chat-staging.ofrc-admin.com/api
    restart: unless-stopped
    networks:
      - chatbot_staging

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env.staging.docker
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      PORT: "4100"
      NODE_ENV: production
      ALLOWED_ORIGINS: https://chat-staging.ofrc-admin.com
      OLLAMA_BASE_URL: http://ofrc-ollama:11434
      OLLAMA_CHAT_MODEL: gemma3:4b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_NUM_CTX: "8192"
    volumes:
      - /var/www/ofrc/chatbot/staging/uploads:/var/www/ofrc/chatbot/staging/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot_staging
      - ofrc_ollama

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - ./server/.env.staging.docker
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot_staging
    entrypoint: ["/bin/bash", "-lc"]
    command: ["chmod +x scripts/run-migrations.sh && ./scripts/run-migrations.sh"]

networks:
  chatbot_staging:
    name: chatbot_staging
  ofrc_ollama:
    external: true
    name: ofrc_ollama
