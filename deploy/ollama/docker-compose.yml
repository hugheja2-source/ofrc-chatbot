# Shared Ollama for the OFRC chatbot. One instance serves staging and production
# so the 8 GB VPS does not load the model twice.
# Listen on localhost only. The chatbot API reaches it on the ofrc_ollama network.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ofrc-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Chat and embeddings stay loaded so a question does not reload Gemma.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    mem_limit: 7g
    cpus: 2
    networks:
      - ofrc_ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  ofrc_ollama:
    name: ofrc_ollama

volumes:
  ollama_data:
