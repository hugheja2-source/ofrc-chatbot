# Shared Ollama for OFRC chatbot embeddings.
# Chat runs on Groq, so only the embedding model stays loaded.
# Listen on localhost only. The chatbot API reaches it on the ofrc_ollama network.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ofrc-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Embeddings stay loaded. Chat no longer uses this container.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    mem_limit: 2g
    cpus: 1
    networks:
      - ofrc_ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  ofrc_ollama:
    name: ofrc_ollama

volumes:
  ollama_data:
